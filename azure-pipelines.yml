trigger:
- none   # auto-run on commits to main; remove if you want only manual runs

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "qa"
    values:
      - qa
      - uat

variables:
- name: CI
  value: true
- name: NODE_ENV
  value: ${{ parameters.environment }}
- ${{ if eq(parameters.environment, 'qa') }}:
  - group: QA-Variables
- ${{ if eq(parameters.environment, 'uat') }}:
  - group: UAT-Variables

steps:
# 0. Checkout latest repo state
- checkout: self

# 1. Install Node.js
- task: UseNode@1
  inputs:
    version: '22.x'
  displayName: 'Install Node.js'

# 2. Install dependencies and Playwright browsers
- script: |
    npm ci
    npx playwright install --with-deps
  displayName: 'Install dependencies and browsers'
  workingDirectory: $(Build.SourcesDirectory)

# 3. Verify package.json before build
- script: |
    pwd
    ls -l package.json
    cat package.json | grep build
  displayName: 'Verify package.json'
  workingDirectory: $(Build.SourcesDirectory)

# 4. Compile TypeScript
- script: npm run build
  displayName: 'Compile TypeScript'
  workingDirectory: $(Build.SourcesDirectory)

# 5. Run Playwright tests (uses dist/GlobalSetUp.js in CI)
- script: |
    mkdir -p junit-results
    npx playwright test --reporter=junit
  displayName: 'Run Playwright tests'
  workingDirectory: $(Build.SourcesDirectory)

# 6. Publish JUnit results to DevOps Test tab
- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/junit-results/junit-report.xml'
    testResultsFormat: 'JUnit'
    failTaskOnFailedTests: true
  displayName: 'Publish JUnit results'

# 7. Publish Allure results as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-results'
    ArtifactName: 'AllureResults'
    publishLocation: 'Container'
  displayName: 'Publish Allure results'

# 8. Publish Playwright HTML report as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/playwright-report'
    ArtifactName: 'HTMLReport'
    publishLocation: 'Container'
  displayName: 'Publish HTML report'
