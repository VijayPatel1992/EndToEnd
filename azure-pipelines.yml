trigger:
- none   # manual runs only

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "qa"
    values:
      - qa
      - uat

variables:
  - name: CI
    value: true
  - name: NODE_ENV
    value: ${{ parameters.environment }}
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: QA-Variables
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: UAT-Variables
  - group: StaticWebAppSecrets   # contains deployment_token

jobs:
- job: TestAndReport
  condition: succeededOrFailed()
  steps:
  # 0. Checkout
  - checkout: self

  # 1. Install Node.js
  - task: UseNode@1
    inputs:
      version: '22.x'
    displayName: 'Install Node.js'

  # 2. Install dependencies + Playwright browsers
  - script: |
      npm ci
      npx playwright install --with-deps
    displayName: 'Install dependencies and browsers'
    workingDirectory: $(Build.SourcesDirectory)

  # 3. Compile TypeScript
  - script: npm run build
    displayName: 'Compile TypeScript'
    workingDirectory: $(Build.SourcesDirectory)

  # 4. Run Playwright tests
  - script: |
      mkdir -p junit-results
      npx playwright test --reporter=junit --output=junit-results
    displayName: 'Run Playwright tests'
    workingDirectory: $(Build.SourcesDirectory)

  # 5. Publish JUnit results
  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/junit-results/*.xml'
      testResultsFormat: 'JUnit'
      failTaskOnFailedTests: true
    displayName: 'Publish JUnit results'

  # 6. Install Allure CLI
  - script: npm install -g allure-commandline --force
    displayName: 'Install Allure Commandline'

  # 7. Generate Allure HTML report
  - script: |
      npx allure generate $(Build.SourcesDirectory)/allure-results --clean -o $(Build.SourcesDirectory)/allure-report
    displayName: 'Generate Allure HTML Report'
    workingDirectory: $(Build.SourcesDirectory)

  # 8. Verify Allure report folder
  - script: |
      ls -l $(Build.SourcesDirectory)/allure-report
    displayName: 'Verify Allure report folder contents'

  # 9. Publish Allure results as artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.SourcesDirectory)/allure-report'
      ArtifactName: 'AllureReport'
      publishLocation: 'Container'
    displayName: 'Publish Allure HTML report artifact'

  # 10. Deploy Allure HTML report to Azure Static Web App
  - task: AzureStaticWebApp@0
    inputs:
      app_location: 'allure-report'   # relative path, not absolute
      skip_app_build: true            # no build needed for static HTML
      azure_static_web_apps_api_token: $(deployment_token)
    displayName: 'Deploy Allure Report to Azure Static Web App'
