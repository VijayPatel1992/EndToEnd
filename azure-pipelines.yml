trigger:
- none   # manual runs only, no auto-trigger on commits

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "qa"
    values:
      - qa
      - uat

variables:
- name: CI
  value: true
- name: NODE_ENV
  value: ${{ parameters.environment }}
- ${{ if eq(parameters.environment, 'qa') }}:
  - group: QA-Variables
- ${{ if eq(parameters.environment, 'uat') }}:
  - group: UAT-Variables
- group: StaticWebAppSecrets   # contains deployment_token

steps:
# 0. Checkout latest repo state
- checkout: self

# 1. Install Node.js
- task: UseNode@1
  inputs:
    version: '22.x'
  displayName: 'Install Node.js'

# 2. Install dependencies and Playwright browsers
- script: |
    npm ci
    npx playwright install --with-deps
  displayName: 'Install dependencies and browsers'
  workingDirectory: $(Build.SourcesDirectory)

  # 2.5. Debug: check working directory and package.json
- script: |
    echo "Current directory: $(pwd)"
    echo "Contents of package.json:"
    cat package.json
  displayName: 'Debug package.json location'
  workingDirectory: $(Build.SourcesDirectory)

# 3. Compile TypeScript
- script: npm run build
  displayName: 'Compile TypeScript'
  workingDirectory: $(Build.SourcesDirectory)

# 4. Run Playwright tests (uses dist/GlobalSetUp.js in CI)
- script: |
    mkdir -p junit-results
    npx playwright test
  displayName: 'Run Playwright tests'
  workingDirectory: $(Build.SourcesDirectory)

# 5. Publish JUnit results to DevOps Test tab
- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/junit-results/junit-report.xml'
    testResultsFormat: 'JUnit'
    failTaskOnFailedTests: true
  displayName: 'Publish JUnit results'

# 6. Publish Allure results as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-results'
    ArtifactName: 'AllureResults'
    publishLocation: 'Container'
  displayName: 'Publish Allure results'

# 7. Publish Playwright HTML report as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/playwright-report'
    ArtifactName: 'HTMLReport'
    publishLocation: 'Container'
  displayName: 'Publish HTML report'

# 8. Publish test result as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/test-results'
    ArtifactName: 'TestResults'
    publishLocation: 'Container'
  displayName: 'Publish test results (screenshots, videos, traces)'

# 9. Generate Allure single-file HTML report
- script: |
    npm install -g allure-commandline --force
    npx allure generate $(Build.SourcesDirectory)/allure-results --clean -o $(Build.SourcesDirectory)/allure-report-single --single-file
    ls -l $(Build.SourcesDirectory)/allure-report-single
  displayName: 'Generate Allure Single-File Report'
  workingDirectory: $(Build.SourcesDirectory)

# 10. Deploy Allure single-file report to Azure Static Web App
- task: AzureStaticWebApp@0
  condition: succeededOrFailed()
  inputs:
    app_location: 'allure-report-single'   # relative path, contains single index.html
    skip_app_build: true                   # no build needed for static HTML
    azure_static_web_apps_api_token: $(swa_token)
  displayName: 'Deploy Single-File Allure Report to Azure Static Web App'

# 11. Publish Allure Report as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-report-single'
    ArtifactName: 'Allure Report'
    publishLocation: 'Container'
  displayName: 'Publish Single-File Allure Report'