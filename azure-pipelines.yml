trigger:
- none   # manual runs only, no auto-trigger on commits

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "qa"
    values:
      - qa
      - uat

variables:
  - name: CI
    value: true
  - name: NODE_ENV
    value: ${{ parameters.environment }}
  - ${{ if eq(parameters.environment, 'qa') }}:
    - group: QA-Variables
  - ${{ if eq(parameters.environment, 'uat') }}:
    - group: UAT-Variables
  - group: StaticWebAppSecrets   # contains deployment_token

steps:
# 0. Checkout latest repo state
- checkout: self

# 1. Install Node.js
- task: UseNode@1
  inputs:
    version: '22.x'
  displayName: 'Install Node.js'

# 2. Install dependencies and Playwright browsers
- script: |
    npm ci
    npx playwright install --with-deps
  displayName: 'Install dependencies and browsers'
  workingDirectory: $(Build.SourcesDirectory)

# 3. Compile TypeScript
- script: npm run build
  displayName: 'Compile TypeScript'
  workingDirectory: $(Build.SourcesDirectory)

# 4. Run Playwright tests
- script: |
    mkdir -p junit-results
    npx playwright test
  displayName: 'Run Playwright tests'
  workingDirectory: $(Build.SourcesDirectory)

# 5. Publish JUnit results to DevOps Test tab
- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/junit-results/junit-report.xml'
    testResultsFormat: 'JUnit'
    failTaskOnFailedTests: true
  displayName: 'Publish JUnit results'

# 6. Generate Allure HTML report
- script: |
    npx allure generate $(Build.SourcesDirectory)/allure-results --clean -o $(Build.SourcesDirectory)/allure-report
  displayName: 'Generate Allure HTML Report'
  condition: succeededOrFailed()
  workingDirectory: $(Build.SourcesDirectory)

# 7. Publish Allure results as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/allure-results'
    ArtifactName: 'AllureResults'
    publishLocation: 'Container'
  displayName: 'Publish Allure results'

# 8. Publish Playwright HTML report as artifact
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/playwright-report'
    ArtifactName: 'HTMLReport'
    publishLocation: 'Container'
  displayName: 'Publish Playwright HTML report'

# 9. Publish test result artifacts (screenshots, videos, traces)
- task: PublishBuildArtifacts@1
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(Build.SourcesDirectory)/test-results'
    ArtifactName: 'TestResults'
    publishLocation: 'Container'
  displayName: 'Publish test results (screenshots, videos, traces)'

# 10. Deploy Allure HTML report to Azure Static Web App
- task: AzureStaticWebApp@0
  condition: succeededOrFailed()
  inputs:
    app_location: '$(Build.SourcesDirectory)/allure-report'   # folder with index.html
    skip_app_build: true                                     # no build needed for static HTML
    azure_static_web_apps_api_token: $(deployment_token)      # from variable group
  displayName: 'Deploy Allure Report to Azure Static Web App'
