name: Playwright Manual Test Execution

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Select test execution mode"
        required: true
        default: "headless"
        type: choice
        options:
          - headless
          - headed
          - debug
          - headed-debug
      test_filter:
        description: "Filter tests by name (leave empty to run all tests)"
        required: false
        type: string
      browser:
        description: "Select browser to use"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      workers:
        description: "Number of parallel workers (1-4)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      environment:
        description: "Select environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - staging
          - production
      generate_report:
        description: "Generate HTML and Allure reports"
        required: true
        default: true
        type: boolean

jobs:
  playwright-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install xvfb (for headed mode on Linux)
        if: github.event.inputs.test_mode == 'headed' || github.event.inputs.test_mode == 'headed-debug'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Create environment file
        run: |
          mkdir -p env
          cat > env/.env.${{ github.event.inputs.environment }} << 'EOF'
          BASE_URL=${{ secrets.BASE_URL }}
          LOGIN_USERNAME=${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD=${{ secrets.LOGIN_PASSWORD }}
          EOF

      - name: Display test configuration
        run: |
          echo "=========================================="
          echo "Test Execution Configuration"
          echo "=========================================="
          echo "Mode: ${{ github.event.inputs.test_mode }}"
          echo "Test Filter: ${{ github.event.inputs.test_filter || 'All tests' }}"
          echo "Browser: ${{ github.event.inputs.browser }}"
          echo "Workers: ${{ github.event.inputs.workers }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Generate Reports: ${{ github.event.inputs.generate_report }}"
          echo "=========================================="

      - name: Set environment file
        run: |
          echo "NODE_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: Run tests - Headless mode
        if: github.event.inputs.test_mode == 'headless'
        run: |
          npx playwright test \
            ${{ github.event.inputs.test_filter && format('--grep {0}', github.event.inputs.test_filter) || '' }} \
            --project=${{ github.event.inputs.browser }} \
            --workers=${{ github.event.inputs.workers }} \
            --reporter=html,junit

      - name: Run tests - Headed mode
        if: github.event.inputs.test_mode == 'headed'
        run: |
          xvfb-run -a npx playwright test \
            ${{ github.event.inputs.test_filter && format('--grep {0}', github.event.inputs.test_filter) || '' }} \
            --project=${{ github.event.inputs.browser }} \
            --workers=${{ github.event.inputs.workers }} \
            --headed \
            --reporter=html,junit

      - name: Run tests - Debug mode
        if: github.event.inputs.test_mode == 'debug'
        run: |
          npx playwright test \
            ${{ github.event.inputs.test_filter && format('--grep {0}', github.event.inputs.test_filter) || '' }} \
            --project=${{ github.event.inputs.browser }} \
            --workers=1 \
            --debug \
            --reporter=html,junit

      - name: Run tests - Headed Debug mode
        if: github.event.inputs.test_mode == 'headed-debug'
        run: |
          xvfb-run -a npx playwright test \
            ${{ github.event.inputs.test_filter && format('--grep {0}', github.event.inputs.test_filter) || '' }} \
            --project=${{ github.event.inputs.browser }} \
            --workers=1 \
            --headed \
            --debug \
            --reporter=html,junit

      - name: Generate Allure Report
        if: github.event.inputs.generate_report == 'true' && always()
        run: |
          npx allure generate allure-results -o allure-report --clean

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Report
        if: github.event.inputs.generate_report == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit-results/
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: junit-results/junit-report.xml
          check_name: Playwright Test Results
          comment_title: Test Results Summary

      - name: Test Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Test Execution Completed"
          echo "=========================================="
          echo "✅ Check the artifacts for detailed reports"
          echo "📈 HTML Report: playwright-html-report"
          echo "📊 Allure Report: allure-report"
          echo "📋 JUnit Report: junit-report"
          echo "=========================================="