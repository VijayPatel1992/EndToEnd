trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- name: CI
  value: true
- name: NODE_ENV
  value: qa   # switch to 'uat' when needed
- group: PlaywrightSecrets   # contains BASE_URL, LOGIN_USERNAME, LOGIN_PASSWORD

steps:
# 1. Install Node.js
- task: UseNode@1
  inputs:
    version: '22.x'
  displayName: 'Install Node.js'

# 2. Install dependencies and Playwright browsers
- script: |
    npm ci
    npx playwright install --with-deps
  displayName: 'Install dependencies and browsers'

# 3. Compile TypeScript (important for CI/CD)
- script: |
    npm run build
  displayName: 'Compile TypeScript'

# 4. Run Playwright tests (uses dist/GlobalSetUp.js in CI)
- script: |
    npx playwright test --reporter=junit
  displayName: 'Run Playwright tests'

# 5. Publish JUnit results to DevOps Test tab
- task: PublishTestResults@2
  inputs:
    testResultsFiles: '**/junit-results/junit-report.xml'
    testResultsFormat: 'JUnit'
    failTaskOnFailedTests: true
  displayName: 'Publish JUnit results'

# 6. Publish Allure results as artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'allure-results'
    ArtifactName: 'AllureResults'
    publishLocation: 'Container'
  displayName: 'Publish Allure results'

# 7. Publish Playwright HTML report as artifact
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'playwright-report'
    ArtifactName: 'HTMLReport'
    publishLocation: 'Container'
  displayName: 'Publish HTML report'
